<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>501호 출석 QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .subtitle {
      color: #888;
      font-size: 18px;
      margin-bottom: 30px;
    }
    .qr-box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(255,255,255,0.1);
      margin-bottom: 30px;
    }
    #qrImage {
      display: block;
      width: 400px;
      height: 400px;
    }
    .time-info {
      text-align: center;
      font-size: 20px;
      color: #ccc;
      margin-bottom: 10px;
    }
    .countdown {
      font-size: 16px;
      color: #888;
    }
    .status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
    }
    .status.ok { background: rgba(76, 175, 80, 0.2); color: #a5d6a7; }
    .status.err { background: rgba(244, 67, 54, 0.2); color: #ef9a9a; }
    .loading { color: #888; font-size: 24px; }
  </style>
</head>
<body>
  <div class="status ok" id="status">🟢 연결됨</div>
  <h1>501호 출석 체크</h1>
  <p class="subtitle">폰으로 QR을 스캔하세요</p>
  
  <div class="qr-box">
    <img id="qrImage" alt="QR 코드" style="display:none;">
    <div id="loadingMsg" class="loading">QR 생성 중...</div>
  </div>
  
  <div class="time-info" id="displayTime">--:--</div>
  <div class="countdown" id="countdown">다음 갱신: --</div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypopD9O5DAtupt_eTAJabXOtvCx8XFumsAjTVFlCFCpi2OvDakRFmxUazIwwZc-Xje/exec';
    
    let currentCode = '';
    let countdownInterval = null;
    let refreshTimeout = null;
    
    function generateQR(text) {
      const primary = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(text);
      const fallback = 'https://quickchart.io/qr?text=' + encodeURIComponent(text) + '&size=400';
      const img = document.getElementById('qrImage');
      const loading = document.getElementById('loadingMsg');
      
      img.onload = () => {
        img.style.display = 'block';
        loading.style.display = 'none';
      };
      img.onerror = () => {
        img.onerror = () => {
          loading.textContent = 'QR 생성 실패';
        };
        img.src = fallback;
      };
      img.src = primary;
    }
    
    function setStatus(type, text) {
      const el = document.getElementById('status');
      el.className = 'status ' + (type === 'ok' ? 'ok' : 'err');
      el.textContent = text;
    }
    
    function startCountdown(seconds) {
      if (countdownInterval) clearInterval(countdownInterval);
      let remaining = seconds;
      
      const update = () => {
        const min = Math.floor(remaining / 60);
        const sec = remaining % 60;
        document.getElementById('countdown').textContent = 
          '다음 갱신: ' + min + '분 ' + (sec < 10 ? '0' : '') + sec + '초';
        remaining--;
        if (remaining < 0) clearInterval(countdownInterval);
      };
      
      update();
      countdownInterval = setInterval(update, 1000);
    }
    
    async function loadQR() {
      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'newGetQR' })
        });
        
        const data = await response.json();
        
        if (!data || !data.code) {
          setStatus('err', '🔴 데이터 오류');
          if (refreshTimeout) clearTimeout(refreshTimeout);
          refreshTimeout = setTimeout(loadQR, 30000);
          return;
        }
        
        if (data.code !== currentCode) {
          currentCode = data.code;
          generateQR(data.code);
        }
        
        document.getElementById('displayTime').textContent = data.displayTime || '--:--';
        
        const secs = data.secondsToNext || 900;
        startCountdown(secs);
        setStatus('ok', '🟢 연결됨');
        
        if (refreshTimeout) clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(loadQR, (secs + 2) * 1000);
      } catch (err) {
        setStatus('err', '🔴 오류: ' + err.message);
        if (refreshTimeout) clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(loadQR, 30000);
      }
    }
    
    // 탭 활성화 시 재로드
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadQR();
    });
    
    loadQR();
  </script>
</body>
</html>
